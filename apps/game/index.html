<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dormant Grid" />
    <meta name="theme-color" content="#0d1014" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <title>DORMANT GRID</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="view"></div>
      <div id="ui"></div>
      <div id="boot" class="boot">
        <div class="boot-title">DORMANT<span>GRID</span></div>
        <div class="boot-bar"><i id="boot-fill"></i></div>
        <div class="boot-tip" id="boot-tip">Waking the city…</div>
      </div>
      <div id="rotate" class="rotate">
        <div class="rotate-phone"></div>
        <p>Turn your phone sideways.<br /><small>The city is wider than it is tall.</small></p>
      </div>
    </div>
    <noscript>DORMANT GRID needs JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
