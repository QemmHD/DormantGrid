name: Deploy (Cloudflare)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Quality gates
        run: npm run check

      - name: Check Cloudflare secrets
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "has_cf=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cf=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Cloudflare deploy skipped::CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID repository secrets are missing. The GitHub Pages fallback (offline-only saves) deploys instead. Add both secrets under Settings > Secrets and variables > Actions."
          fi

      # The game is built by `npm run check` (apps/game/dist) with same-origin /api,
      # and the Worker serves it as static assets alongside the API.
      - name: Deploy Worker (game + API)
        id: deploy
        if: steps.cf.outputs.has_cf == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/server
          command: deploy

      - name: Smoke test live URL
        id: smoke
        if: steps.cf.outputs.has_cf == 'true'
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -e
          if [ -z "$URL" ]; then echo "::error::wrangler did not report a deployment URL (is a workers.dev subdomain set up on the account?)"; exit 1; fi
          echo "Live URL: $URL" >> "$GITHUB_STEP_SUMMARY"
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/version.json -w '%{http_code}' "$URL/api/version" || true)
            [ "$code" = "200" ] && break
            sleep $((i * 3))
          done
          cat /tmp/version.json; echo
          [ "$code" = "200" ] || { echo "::error::/api/version returned $code"; exit 1; }
          home=$(curl -s -o /dev/null -w '%{http_code}' "$URL/")
          [ "$home" = "200" ] || { echo "::error::game shell returned $home"; exit 1; }
          sw=$(curl -s -o /dev/null -w '%{http_code}' "$URL/manifest.webmanifest")
          echo "manifest: $sw"

      - name: Roll back on failed smoke test
        if: failure() && steps.deploy.outcome == 'success' && steps.smoke.outcome == 'failure'
        working-directory: apps/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler rollback -y -m "auto rollback: post-deploy smoke test failed"

      # Optional: also publish the static game to Cloudflare Pages (set repo variable DEPLOY_PAGES=true).
      # The Pages copy has no same-origin API, so it is offline-only unless VITE_API_URL is set.
      - name: Deploy to Cloudflare Pages (optional)
        if: steps.cf.outputs.has_cf == 'true' && vars.DEPLOY_PAGES == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project create dormant-grid --production-branch main || echo "Pages project already exists"
          npx wrangler pages deploy apps/game/dist --project-name dormant-grid --branch main
